name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BUNDLE_ID: com.hainesy.VoiceInkMeetings
  # Host, not a full URL. Two reasons: a renamed appcast on the same host is just as
  # disqualifying as the exact one, and the Sparkle feed is not the only thing that pointed
  # here -- AnnouncementsService fetched remote config from this host too (now removed).
  # scripts/assert-fork-identity.sh does a host-level substring match over the whole bundle.
  FORBIDDEN_UPSTREAM_HOST: beingpax.github.io
  # Upstream's bundle id prefix, Apple Developer team id, and Sparkle public EdDSA key.
  # Any of the three coming back would re-point this fork's identity, signing or update
  # trust at upstream. The team id and the test-bundle identifiers never appear in the
  # built .app, which is why the assertion also runs in --project mode.
  FORBIDDEN_UPSTREAM_BUNDLE_PREFIX: com.prakashjoshipax
  FORBIDDEN_UPSTREAM_TEAM_ID: V6J6A3VWY2
  FORBIDDEN_UPSTREAM_ED_KEY: gnXep9+mzNXFSbX0jU7CpLtubcQ5WVfVGe0BxsSdS40=

jobs:
  build-and-test:
    # macos-15's newest available Xcode (26.3) ships Swift tools 6.2.4, which is too old for
    # mlx-swift 0.31.6 (needs 6.3.0+, the version actually locked in Package.resolved) --
    # confirmed by CI itself: "package 'mlx-swift' @ 0.31.6 is using Swift tools version 6.3.0
    # but the installed version is 6.2.4". macos-26 ships Xcode 26.6 (build 17F113) as its
    # default, which matches this Mac's local toolchain exactly. See FORK-PATCHES.md.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # Every action is pinned to a full commit sha. A tag -- even a version tag, and
      # especially a floating major like @v4 -- is a mutable pointer the action's owner can
      # repoint at any time, so `uses: some/action@v4` is an instruction to run whatever
      # code that account publishes next, with this workflow's token. The trailing comment
      # records which release the sha is, so bumps stay readable in review.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: |
          # LLMkit (a transitive SPM dependency) requires Swift tools 6.2+, which the
          # macos-15 runner's default Xcode (16.4) does not ship. Pick the newest
          # available Xcode 26.x instead.
          xcode_app="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode_app" ]; then
            echo "error: no Xcode 26.x found on this runner" >&2
            ls /Applications | grep -i Xcode >&2
            exit 1
          fi
          echo "Selecting $xcode_app"
          sudo xcode-select -s "$xcode_app"

      - name: Show toolchain versions
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          build="$(xcodebuild -version | awk '/^Build version/{print $3}')"
          echo "xcode_build=$build" >> "$GITHUB_OUTPUT"

      # Runs BEFORE anything is built, because a macro or build-tool plugin is code that
      # executes on this runner during the build. See scripts/verify-package-trust.sh and
      # FORK-PATCHES.md section 6: this is the mechanism that makes the one remaining
      # -skipPackagePluginValidation safe to keep.
      #
      # It binds the WHOLE resolved input, not just the macro/plugin targets a regex can find
      # in the manifests. A Package.swift is executable Swift, so a plugin declared via a
      # helper function or a variable matches no pattern; the earlier regex-only guard passed
      # a graph containing exactly that. The check now fails if the set of pinned packages
      # changes at all, if any pinned revision or location moves, if any root Package*.swift
      # blob differs, or if Package.resolved's bytes differ from the reviewed sha256 --
      # regardless of how a target is declared inside any manifest. Re-bless with
      # `scripts/verify-package-trust.sh --update`; that diff is the review record.
      - name: Verify package plugin/macro trust
        run: scripts/verify-package-trust.sh

      # Cheap, and it fails fast. The test bundles' identifiers and DEVELOPMENT_TEAM only
      # exist in the project file -- they are never inside the built .app -- so the product
      # scan later on cannot see them.
      - name: Assert fork identity of the project configuration
        run: scripts/assert-fork-identity.sh --project "$(pwd)"

      - name: Read pinned whisper.cpp revision
        id: whisper_ref
        run: |
          # Pinned in whisper-cpp.rev, NOT resolved from upstream HEAD at build time.
          # whisper.cpp is compiled into whisper.xcframework and linked into the shipped
          # app, so building "whatever HEAD is right now" made an unreviewed, remotely
          # mutable input part of every build. The same value keys the cache below and
          # drives `make setup`, so cache and build can never diverge.
          sha="$(grep -v '^[[:space:]]*#' whisper-cpp.rev | tr -d '[:space:]')"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "error: whisper-cpp.rev does not contain a 40-character sha: '$sha'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "whisper.cpp pinned at $sha"

      - name: Restore whisper.xcframework cache
        id: whisper_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/VoiceInk-Dependencies
          key: whisper-deps-${{ runner.os }}-xcode${{ steps.toolchain.outputs.xcode_build }}-${{ steps.whisper_ref.outputs.sha }}

      - name: Build whisper.xcframework (cache miss)
        if: steps.whisper_cache.outputs.cache-hit != 'true'
        run: make setup

      - name: Save whisper.xcframework cache
        # A separate save step run right after the build (not `save-always` on the combined
        # cache action, which GitHub says "does not work as intended"), so it lands before any
        # later step (app build, tests) can fail -- building whisper.xcframework is expensive
        # and independent of whether the rest of the job passes.
        if: steps.whisper_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/VoiceInk-Dependencies
          key: ${{ steps.whisper_cache.outputs.cache-primary-key }}

      - name: Verify whisper.xcframework is present and built from the pinned revision
        run: |
          deps="$HOME/VoiceInk-Dependencies/whisper.cpp"
          test -d "$deps/build-apple/whisper.xcframework"
          # The cache key contains the sha, so a restored cache should already match; assert
          # it rather than assume, since a stale checkout would otherwise ship silently.
          head="$(git -C "$deps" rev-parse HEAD)"
          if [ "$head" != "${{ steps.whisper_ref.outputs.sha }}" ]; then
            echo "error: whisper.cpp checkout is at $head, expected ${{ steps.whisper_ref.outputs.sha }}" >&2
            exit 1
          fi
          echo "whisper.cpp at $head matches whisper-cpp.rev"

      - name: Build VoiceInk (unsigned local build)
        # -skipMacroValidation is deliberately NOT passed. It used to be required, because
        # mlx-swift-lm's MLXHuggingFaceMacros macro was in the build graph via the
        # MLXHuggingFace product; this fork now provides that macro's expansion itself
        # (VoiceInkRefineXPC/HuggingFaceTokenizerLoader.swift) and no longer links the
        # product, so no macro is built at all. Its absence here is the proof: with a macro
        # in the graph and no flag, the build fails with
        #   `Macro "MLXHuggingFaceMacros" from package "mlx-swift-lm" must be enabled
        #    before it can be used`   (CI run 33442033271)
        # so if anything ever puts a macro back, this step fails instead of silently
        # trusting it.
        #
        # -skipPackagePluginValidation is still required, for exactly one component:
        # mlx-swift attaches its CudaBuild build-tool plugin unconditionally to Cmlx, the
        # core target every MLX product depends on, so it cannot be dropped without forking
        # mlx-swift (run 33486090430: `Validate plug-in "CudaBuild" in package "mlx-swift"`
        # -> ** BUILD FAILED **). The flag is blanket by nature, so the
        # "Verify package plugin/macro trust" step above bounds it: it fails the build if
        # any macro or plugin in the pinned graph is not one this fork has reviewed, or if
        # a reviewed one's source changes. See FORK-PATCHES.md section 6.
        #
        # -onlyUsePackageVersionsFromResolvedFile: a from-scratch resolve on a fresh checkout
        # was picking the FLOOR of a transitive dependency's version range (mlx-swift 0.31.4)
        # instead of the version locked in Package.resolved (0.31.6), which is missing an API
        # mlx-swift-lm needs.
        run: >
          make local
          LOCAL_XCODEBUILD_FLAGS="-skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile"

      - name: Locate built app
        id: app
        run: |
          app_path="$HOME/Downloads/VoiceInk.app"
          test -d "$app_path" || { echo "error: $app_path not found after make local" >&2; exit 1; }
          echo "path=$app_path" >> "$GITHUB_OUTPUT"

      # Verifies the ASSERTION ITSELF before trusting it against the real build. A check that
      # silently never fires is worse than no check: it reads as green forever. Each control
      # is a fabricated input the assertion MUST reject; if any is accepted, CI fails here.
      - name: Self-test the fork-identity assertion (negative controls)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mk() { # mk <dir> <bundle-id> [feed-url]
            mkdir -p "$1/Contents"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $2" "$1/Contents/Info.plist" >/dev/null
            if [ -n "${3:-}" ]; then
              /usr/libexec/PlistBuddy -c "Add :SUFeedURL string $3" "$1/Contents/Info.plist" >/dev/null
            fi
          }
          must_reject() {
            if scripts/assert-fork-identity.sh "$1" >/dev/null 2>&1; then
              echo "error: assertion ACCEPTED a bundle it must reject ($2)" >&2
              exit 1
            fi
            echo "  rejected as expected: $2"
          }
          must_reject_project() {
            if scripts/assert-fork-identity.sh --project "$1" >/dev/null 2>&1; then
              echo "error: assertion ACCEPTED a project it must reject ($2)" >&2
              exit 1
            fi
            echo "  rejected as expected: $2"
          }

          # Positive control: a clean bundle must pass, or the assertion is simply always-fail
          # and would tell us nothing about the real build.
          mk "$tmp/Clean.app" "$EXPECTED_BUNDLE_ID"
          scripts/assert-fork-identity.sh "$tmp/Clean.app" >/dev/null
          echo "  accepted as expected: clean bundle"

          mk "$tmp/Exact.app"    "$EXPECTED_BUNDLE_ID" "https://$FORBIDDEN_UPSTREAM_HOST/VoiceInk/appcast.xml"
          must_reject "$tmp/Exact.app" "upstream appcast URL"

          # The near-miss an exact-string comparison would have waved through.
          mk "$tmp/NearMiss.app" "$EXPECTED_BUNDLE_ID" "https://$FORBIDDEN_UPSTREAM_HOST/VoiceInk/appcast-v2.xml"
          must_reject "$tmp/NearMiss.app" "renamed appcast on upstream's host"

          mk "$tmp/UpstreamId.app" "$FORBIDDEN_UPSTREAM_BUNDLE_PREFIX.VoiceInk"
          must_reject "$tmp/UpstreamId.app" "upstream bundle id"

          # Feed URL hidden outside the top-level Info.plist.
          mk "$tmp/Nested.app" "$EXPECTED_BUNDLE_ID"
          mkdir -p "$tmp/Nested.app/Contents/Resources"
          printf 'feed=https://%s/VoiceInk/appcast.xml\n' "$FORBIDDEN_UPSTREAM_HOST" \
            > "$tmp/Nested.app/Contents/Resources/config.dat"
          must_reject "$tmp/Nested.app" "upstream host referenced in a nested resource"

          # Upstream's Sparkle public key: whoever holds the matching private key can hand
          # this app an update it will accept.
          mk "$tmp/EdKey.app" "$EXPECTED_BUNDLE_ID"
          /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string $FORBIDDEN_UPSTREAM_ED_KEY" \
            "$tmp/EdKey.app/Contents/Info.plist" >/dev/null
          must_reject "$tmp/EdKey.app" "upstream Sparkle public key"

          # Upstream's Apple Developer team id, as it would appear in an embedded profile or
          # a code signature.
          mk "$tmp/TeamId.app" "$EXPECTED_BUNDLE_ID"
          mkdir -p "$tmp/TeamId.app/Contents/Resources"
          printf 'TeamIdentifier=%s\n' "$FORBIDDEN_UPSTREAM_TEAM_ID" \
            > "$tmp/TeamId.app/Contents/Resources/embedded.provisionprofile"
          must_reject "$tmp/TeamId.app" "upstream team id inside the bundle"

          # The XPC service ships inside the app and is signed with it, so an upstream id
          # there matters as much as one at the top level.
          mk "$tmp/NestedXpc.app" "$EXPECTED_BUNDLE_ID"
          mkdir -p "$tmp/NestedXpc.app/Contents/XPCServices/Refine.xpc/Contents"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.example.Rogue" \
            "$tmp/NestedXpc.app/Contents/XPCServices/Refine.xpc/Contents/Info.plist" >/dev/null
          must_reject "$tmp/NestedXpc.app" "nested XPC bundle outside the fork's identifier"

          # An unreadable path must FAIL the scan, not be silently skipped. `grep ... || true`
          # or `2>/dev/null` would turn this into a pass and quietly drop part of the tree.
          mk "$tmp/Unreadable.app" "$EXPECTED_BUNDLE_ID"
          mkdir -p "$tmp/Unreadable.app/Contents/Resources"
          printf 'nothing to see\n' > "$tmp/Unreadable.app/Contents/Resources/locked.dat"
          chmod 000 "$tmp/Unreadable.app/Contents/Resources/locked.dat"
          must_reject "$tmp/Unreadable.app" "unreadable file (scan could not complete)"
          chmod 644 "$tmp/Unreadable.app/Contents/Resources/locked.dat"

          # --project mode, which is the only check that can see the test bundles' ids and
          # DEVELOPMENT_TEAM.
          mkproj() { # mkproj <dir> <bundle-id> <team-id>
            mkdir -p "$1/VoiceInk.xcodeproj"
            {
              printf '\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = %s;\n' "$2"
              printf '\t\t\t\tDEVELOPMENT_TEAM = "%s";\n' "$3"
            } > "$1/VoiceInk.xcodeproj/project.pbxproj"
          }
          mkproj "$tmp/proj-clean" "$EXPECTED_BUNDLE_ID.Tests" ""
          scripts/assert-fork-identity.sh --project "$tmp/proj-clean" >/dev/null
          echo "  accepted as expected: clean project configuration"

          mkproj "$tmp/proj-team" "$EXPECTED_BUNDLE_ID.Tests" "$FORBIDDEN_UPSTREAM_TEAM_ID"
          must_reject_project "$tmp/proj-team" "upstream DEVELOPMENT_TEAM restored"

          mkproj "$tmp/proj-id" "$FORBIDDEN_UPSTREAM_BUNDLE_PREFIX.VoiceInkTests" ""
          must_reject_project "$tmp/proj-id" "upstream test-bundle identifier"

          echo "fork-identity assertion verified: rejects every control, accepts clean inputs"

      - name: Assert fork identity of the built app
        run: scripts/assert-fork-identity.sh "${{ steps.app.outputs.path }}"

      # -configuration Debug is load-bearing, not a preference. The scheme's TestAction is set
      # to Release, and ENABLE_TESTABILITY=YES is only ever set on Debug (project.pbxproj), so
      # a Release test build produces a VoiceInk.swiftmodule with no testing information and
      # `@testable import VoiceInk` in Tests/VoiceInkTests fails to resolve:
      #   error: unable to resolve Swift module dependency to a compatible module: 'VoiceInk'
      #   note: found incompatible module '.../Release/VoiceInk.swiftmodule/arm64-apple-macos...'
      # (CI run 33449207129, exit 65). Debug is also the configuration the project already
      # wires for testing: TEST_HOST there points at "VoiceInk Dev.app", which is what the
      # Debug build actually produces.
      #
      # -skip-testing:VoiceInkUITests: the UI test bundle drives a real XCUIApplication launch,
      # and VoiceInk needs Accessibility and microphone consent to get past its onboarding.
      # A GitHub runner grants neither, so these cannot pass unattended. The unit test bundle
      # (VoiceInkTests) does run. Revisit if the UI tests are ever made permission-free.
      #
      # Same flag set as the app build: no -skipMacroValidation, and
      # -skipPackagePluginValidation only for the reviewed CudaBuild plugin.
      #
      # env.TEST_RUNNER_VOICEINK_CI: `xcodebuild test` launches the actual xctest host
      # ("VoiceInk Dev.app" / VoiceInkTests.xctest) through a LaunchServices-mediated path that
      # does NOT inherit this step's own environment -- a plain `GITHUB_ACTIONS` or `CI` check
      # inside a test body evaluates to nil there even though this shell sees it fine. Verified
      # empirically (Phase 1 Stage 1, mic-route PR #3): xcodebuild forwards any env var prefixed
      # `TEST_RUNNER_` into that host process with the prefix stripped; a plain `xcodebuild
      # TEST_RUNNER_X=1 test ...` trailing argument does NOT do this (that sets a build setting,
      # not a process environment variable) -- it must be a real environment variable on the
      # process that invokes xcodebuild, which `env:` below provides. This is how
      # AudioGraphExceptionBridgeTests.swift tells this runner apart from a developer Mac to
      # skip the three tests in it that hang for ~600s against this runner's CoreAudio device
      # inventory, without skipping them everywhere. See that file's header and
      # FORK-PATCHES.md's "phase-1-mic-route" section for the full diagnosis.
      - name: Run test targets
        env:
          TEST_RUNNER_VOICEINK_CI: 1
        run: |
          xcodebuild test \
            -project VoiceInk.xcodeproj \
            -scheme VoiceInk \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .ci-test-build \
            -xcconfig LocalBuild.xcconfig \
            -skip-testing:VoiceInkUITests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="$(pwd)/VoiceInk/VoiceInk.local.entitlements" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD' \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile

      # Compiles the MeetingStore negative controls -- source files that MUST NOT COMPILE --
      # into the app target, and fails if any of them builds or if any expected compiler
      # diagnostic goes missing. MeetingStore claims a structural guarantee (no code outside
      # its file can reach the ModelContext it mutates); two earlier designs of that boundary
      # were each hand-verified as correct and then defeated in one line by review, so the
      # claim is re-attacked on every run rather than trusted. Runs AFTER the test step and
      # reuses .ci-test-build on purpose, so each attack is an incremental one-file compile
      # rather than a cold build. It is the last step that builds anything.
      - name: Verify MeetingStore isolation negative controls
        run: scripts/verify-meeting-store-isolation.sh --derived-data .ci-test-build

      # The trust check above runs before the build, against the COMMITTED Package.resolved.
      # -onlyUsePackageVersionsFromResolvedFile is supposed to stop xcodebuild re-resolving,
      # but "supposed to" is not a guarantee, and a build-time re-resolution that pulled in a
      # new package would land after the guard had already passed. So assert afterwards that
      # the pinned graph is still the one that was verified. Compares the pins themselves
      # rather than the file's bytes, so a cosmetic rewrite (originHash, key order) does not
      # fail the build while an added, removed or moved package does.
      - name: Assert the resolved graph was not changed by the build
        if: always()
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys
          path = "VoiceInk.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          def pins(text):
              return {(p["identity"], p.get("kind"), p.get("location"), p["state"]["revision"])
                      for p in json.loads(text)["pins"]}
          committed = pins(subprocess.run(["git", "show", "HEAD:" + path],
                                          capture_output=True, text=True, check=True).stdout)
          current = pins(open(path).read())
          added, removed = current - committed, committed - current
          if added or removed:
              for p in sorted(added):
                  print("  + " + " ".join(str(x) for x in p), file=sys.stderr)
              for p in sorted(removed):
                  print("  - " + " ".join(str(x) for x in p), file=sys.stderr)
              sys.exit("error: the build rewrote Package.resolved; the graph verified before "
                       "the build is not the graph that was built")
          print(f"resolved graph unchanged by the build: {len(current)} pinned package(s)")
          EOF

      - name: Zip built app artifact
        run: |
          mkdir -p artifact
          ditto -c -k --keepParent "${{ steps.app.outputs.path }}" artifact/VoiceInk.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VoiceInk-app
          path: artifact/VoiceInk.zip
          retention-days: 14
